name: Build BIM Purchases V3 APK

on:
  push:
    branches: [ purchases-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source and apply V3
        env:
          MAIN_GZ: ''
          MANIFEST_GZ: ''
          STRINGS_GZ: ''
          GRADLE_GZ: ''
          BIM_MARK: ''
        run: |
          rm -rf purchases-build purchases.zip
          mkdir -p purchases-build
          base64 -d purchases_project.zip.b64 > purchases.zip
          unzip -q purchases.zip -d purchases-build

          printf '%s' "$MAIN_GZ" | base64 -d | gzip -d > purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java
          printf '%s' "$MANIFEST_GZ" | base64 -d | gzip -d > purchases-build/app/src/main/AndroidManifest.xml
          printf '%s' "$STRINGS_GZ" | base64 -d | gzip -d > purchases-build/app/src/main/res/values/strings.xml
          printf '%s' "$GRADLE_GZ" | base64 -d | gzip -d > purchases-build/app/build.gradle.kts

          mkdir -p purchases-build/app/src/main/res/drawable-nodpi
          printf '%s' "$BIM_MARK" | base64 -d > purchases-build/app/src/main/res/drawable-nodpi/bim_mark.png

          # Use BIM mark for all launcher icon references in the restored source.
          python - <<'PY'
          from pathlib import Path
          p=Path('purchases-build/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('@mipmap/ic_launcher_round','@drawable/bim_mark')
          s=s.replace('@mipmap/ic_launcher','@drawable/bim_mark')
          s=s.replace('@drawable/ic_launcher_round','@drawable/bim_mark')
          s=s.replace('@drawable/ic_launcher','@drawable/bim_mark')
          p.write_text(s)
          PY
          grep -q '@drawable/bim_mark' purchases-build/app/src/main/AndroidManifest.xml

          # This lightweight project does not generate BuildConfig; keep the app version explicit.
          python - <<'PY'
          from pathlib import Path
          p=Path('purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java')
          s=p.read_text().replace('BuildConfig.VERSION_NAME', '"3.0.0"')
          p.write_text(s)
          PY

          grep -q 'BIMDamascusPurchases/3.0' purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java
          grep -q 'versionName = "3.0.0"' purchases-build/app/build.gradle.kts
          grep -q 'USE_BIOMETRIC' purchases-build/app/src/main/AndroidManifest.xml
          grep -q 'AKfycbxjFwoHREReyWBwbXmvOFCZP-v-k6iEDCkOu5TzKsLP-HzWJDrIkZHcxMeMbR15TyLMsA' purchases-build/app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BIM Purchases V3 APK
        run: gradle --no-daemon -p purchases-build assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp purchases-build/app/build/outputs/apk/debug/app-debug.apk "output/BIM-Damascus-Purchases-V3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bim-purchases-v3-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
