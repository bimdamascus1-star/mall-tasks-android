name: Build BIM Purchases APK

on:
  push:
    branches: [ purchases-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore purchases source
        run: |
          mkdir -p purchases-build
          base64 -d purchases_project.zip.b64 > purchases.zip
          unzip -q purchases.zip -d purchases-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BIM purchases APK
        run: gradle --no-daemon -p purchases-build assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp purchases-build/app/build/outputs/apk/debug/app-debug.apk "output/BIM-Damascus-Purchases.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bim-purchases-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
