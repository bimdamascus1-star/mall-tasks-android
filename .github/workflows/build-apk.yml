name: Build BIM Purchases V2 APK

on:
  push:
    branches: [ purchases-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V1 source and apply V2
        env:
          JAVA_GZ: ''
          JS_GZ: ''
          BIM_MARK: ''
        run: |
          rm -rf purchases-build purchases.zip
          mkdir -p purchases-build
          base64 -d purchases_project.zip.b64 > purchases.zip
          unzip -q purchases.zip -d purchases-build
          mkdir -p purchases-build/app/src/main/assets
          mkdir -p purchases-build/app/src/main/res/drawable-nodpi

          printf '%s' "$JAVA_GZ" | base64 -d | gzip -d > purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java
          printf '%s' "$JS_GZ" | base64 -d | gzip -d > purchases-build/app/src/main/assets/bim_v2.js
          printf '%s' "$BIM_MARK" | base64 -d > purchases-build/app/src/main/res/drawable-nodpi/bim_mark.png

          sed -i 's/android:icon="@drawable\/ic_launcher"/android:icon="@drawable\/bim_mark"/' purchases-build/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 1/versionCode = 20/' purchases-build/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "2.0.0"/' purchases-build/app/build.gradle.kts
          sed -i 's/#C70F1A/#CD141A/' purchases-build/app/src/main/res/values/colors.xml
          sed -i 's/#990B13/#A70F14/' purchases-build/app/src/main/res/values/colors.xml

          python - <<'PY'
          from pathlib import Path
          p=Path('purchases-build/app/src/main/res/values/styles.xml')
          s=p.read_text()
          if 'windowLightNavigationBar' not in s:
              s=s.replace('<item name="android:navigationBarColor">@color/white</item>',
                          '<item name="android:navigationBarColor">@color/white</item>\n        <item name="android:windowLightNavigationBar">true</item>')
          p.write_text(s)
          PY

          test -s purchases-build/app/src/main/assets/bim_v2.js
          test -s purchases-build/app/src/main/res/drawable-nodpi/bim_mark.png
          grep -q 'BIMDamascusPurchases/2.0' purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BIM Purchases V2 APK
        run: gradle --no-daemon -p purchases-build assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp purchases-build/app/build/outputs/apk/debug/app-debug.apk "output/BIM-Damascus-Purchases-V2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bim-purchases-v2-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
