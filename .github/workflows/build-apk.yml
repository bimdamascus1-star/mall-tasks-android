name: Build BIM Purchases APK

on:
  push:
    branches: [ purchases-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and patch purchases source
        run: |
          rm -rf purchases-build purchases.zip
          mkdir -p purchases-build
          base64 -d purchases_project.zip.b64 > purchases.zip
          unzip -q purchases.zip -d purchases-build
          python <<'PY'
          from pathlib import Path

          main = Path('purchases-build/app/src/main/java/com/bimdamascus/purchases/MainActivity.java')
          s = main.read_text()
          s = s.replace(
              'WebView.enableSafeBrowsing(this, null);',
              'WebView.startSafeBrowsing(this, null);'
          )

          anchor = '''        root.setLayoutParams(new ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.MATCH_PARENT
          ));
          '''
          safe = '''        root.setLayoutParams(new ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.MATCH_PARENT
          ));

          // Android 15+ enforces edge-to-edge for targetSdk 35.
          // Respect the real status/navigation-bar safe areas so the
          // bottom web navigation remains fully visible and tappable.
          if (Build.VERSION.SDK_INT >= 35) {
              root.setOnApplyWindowInsetsListener((view, insets) -> {
                  int topInset = insets.getSystemWindowInsetTop();
                  int bottomInset = insets.getSystemWindowInsetBottom();
                  view.setPadding(0, topInset, 0, bottomInset);
                  return insets;
              });
          }
          '''
          if 'root.setOnApplyWindowInsetsListener' not in s:
              if anchor not in s:
                  raise SystemExit('Safe-area anchor not found')
              s = s.replace(anchor, safe, 1)

          s = s.replace(
              '        setContentView(root);',
              '''        setContentView(root);
          if (Build.VERSION.SDK_INT >= 35) {
              root.requestApplyInsets();
          }''',
              1
          )
          main.write_text(s)

          gradle = Path('purchases-build/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 1', 'versionCode = 2')
          g = g.replace('versionName = "1.0.0"', 'versionName = "1.0.1"')
          gradle.write_text(g)

          styles = Path('purchases-build/app/src/main/res/values/styles.xml')
          x = styles.read_text()
          if 'windowLightNavigationBar' not in x:
              x = x.replace(
                  '<item name="android:navigationBarColor">@color/white</item>',
                  '<item name="android:navigationBarColor">@color/white</item>\n        <item name="android:windowLightNavigationBar">true</item>'
              )
          styles.write_text(x)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BIM purchases APK
        run: gradle --no-daemon -p purchases-build assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp purchases-build/app/build/outputs/apk/debug/app-debug.apk "output/BIM-Damascus-Purchases-1.0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bim-purchases-apk-1.0.1
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
